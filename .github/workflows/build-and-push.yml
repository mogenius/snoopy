name: Build and Push
on:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  release:
    runs-on: self-hosted
    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        fetch-depth: 0

    # cycjimmy/semantic-release-action shells out to `npm ci` to install
    # semantic-release + plugins. The self-hosted runner has no npm in PATH,
    # so the step exits 127 silently (action still reports success but
    # `new_release_published` stays empty -> the Release step gets skipped).
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '24'

    - name: Semantic Release
      id: semantic_release
      uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build --pull -t snoopy:latest .

    - name: Create output directory for binaries
      run: mkdir -p output

    - name: Extract binaries from Docker image
      run: |
        container_id=$(docker create snoopy:latest)
        docker cp $container_id:/usr/local/bin/snoopy_x86_64-unknown-linux-musl ./output/snoopy_x86_64
        docker cp $container_id:/usr/local/bin/snoopy_aarch64-unknown-linux-musl ./output/snoopy_aarch64
        docker cp $container_id:/usr/local/bin/snoopy_riscv64-unknown-linux-musl ./output/snoopy_riscv64
        docker cp $container_id:/usr/local/bin/snoopy_powerpc64le-unknown-linux-musl ./output/snoopy_powerpc64le
        docker cp $container_id:/usr/local/bin/snoopy_armv7-unknown-linux-musleabi ./output/snoopy_armv7
        docker rm $container_id

    - name: Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      if: ${{ steps.semantic_release.outputs.new_release_published }} # only run if a new release is published
      with:
        tag_name: v${{ steps.semantic_release.outputs.new_release_version }}
        files: |
          ./output/*

    # Release notes and commit messages are passed via env instead of being
    # interpolated into the script, so their content can't break out of the shell.
    - name: Job Summary
      if: ${{ always() }}
      env:
        RELEASE_PUBLISHED: ${{ steps.semantic_release.outputs.new_release_published }}
        RELEASE_VERSION: ${{ steps.semantic_release.outputs.new_release_version }}
        LAST_VERSION: ${{ steps.semantic_release.outputs.last_release_version }}
        RELEASE_NOTES: ${{ steps.semantic_release.outputs.new_release_notes }}
      run: |
        {
          echo "## 🐕 Snoopy Build Summary"
          echo ""
          if [ "${RELEASE_PUBLISHED}" = "true" ]; then
            echo "### 🚀 New release: \`v${RELEASE_VERSION}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous version | \`v${LAST_VERSION:-none}\` |"
            echo "| New version | \`v${RELEASE_VERSION}\` |"
            echo "| Release | [v${RELEASE_VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}) |"
          else
            echo "### ℹ️ No new release"
            echo ""
            echo "No release-relevant commits since \`v${LAST_VERSION:-none}\` — the Docker build ran as a sanity check only."
          fi
          echo ""

          if [ -n "${LAST_VERSION}" ] && git rev-parse "v${LAST_VERSION}" >/dev/null 2>&1; then
            echo "### 🔀 Commits since v${LAST_VERSION}"
            echo ""
            git log "v${LAST_VERSION}..HEAD" --no-merges --pretty=format:'- `%h` %s (%an)' | head -50
            echo ""
            echo ""
          fi

          if [ -d output ] && [ -n "$(ls -A output 2>/dev/null)" ]; then
            echo "### 📦 Binaries"
            echo ""
            echo "| Binary | Size |"
            echo "|---|---|"
            for f in output/*; do
              echo "| \`$(basename "${f}")\` | $(du -h "${f}" | cut -f1) |"
            done
            echo ""
          else
            echo "### ⚠️ No binaries were extracted"
            echo ""
          fi

          if [ "${RELEASE_PUBLISHED}" = "true" ] && [ -n "${RELEASE_NOTES}" ]; then
            echo "<details><summary>📝 Release Notes</summary>"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            echo "</details>"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
